<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Bolt: Kudosu app icon placeholder (hand-drawn SVG).
    Design per plan: dark cyan background, black notepad, pink zoomed
    sudoku-grid (tic-tac-toe style) fragment. Replace or keep as-is.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#0d4a52"/>
      <stop offset="100%" stop-color="#04262b"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0c0c10"/>
    </linearGradient>
  </defs>

  <!-- dark cyan background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="190" fill="#0a3d45" opacity="0.55"/>

  <!-- black notepad, slightly tilted -->
  <g transform="rotate(-6 256 280)">
    <rect x="96" y="128" width="320" height="330" rx="34" fill="url(#paper)"/>
    <rect x="96" y="128" width="320" height="330" rx="34" fill="none" stroke="#3a4a4d" stroke-width="6" opacity="0.6"/>
    <!-- notepad spiral binding -->
    <g fill="#08333a" stroke="#5fb7c1" stroke-width="5">
      <circle cx="150" cy="128" r="14"/>
      <circle cx="212" cy="128" r="14"/>
      <circle cx="274" cy="128" r="14"/>
      <circle cx="336" cy="128" r="14"/>
      <circle cx="396" cy="128" r="14"/>
    </g>

    <!-- pink sudoku fragment, zoomed like a tic-tac-toe grid -->
    <g stroke="#ff6fa5" stroke-width="14" stroke-linecap="round">
      <line x1="176" y1="196" x2="368" y2="196"/>
      <line x1="176" y1="290" x2="368" y2="290"/>
      <line x1="176" y1="384" x2="368" y2="384"/>
      <line x1="176" y1="196" x2="176" y2="384"/>
      <line x1="272" y1="196" x2="272" y2="384"/>
      <line x1="368" y1="196" x2="368" y2="384"/>
    </g>
    <!-- a few filled pink cells for the "zoomed puzzle" feel -->
    <g fill="#ff6fa5" opacity="0.85">
      <rect x="196" y="216" width="56" height="54" rx="10"/>
      <rect x="292" y="310" width="56" height="54" rx="10"/>
    </g>
    <g fill="#0c0c10" font-family="Arial, sans-serif" font-weight="bold" font-size="44" text-anchor="middle">
      <text x="224" y="258">5</text>
      <text x="320" y="352">7</text>
    </g>
  </g>
</svg>
