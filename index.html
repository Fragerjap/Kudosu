<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Kudosu — Sudoku Adventure</title>
  <meta name="description" content="Offline sudoku adventure: cozy castle, four puzzle lands, gold and levels.">
  <meta name="theme-color" content="#06282e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kudosu">
  <link rel="manifest" href="/public/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/public/assets/icons/icon.png">
  <link rel="apple-touch-icon" href="/public/assets/icons/icon.png">
  <link rel="stylesheet" href="/public/styles.css">
  <!-- Bolt: Supabase removed — local-only IndexedDB, no external services. -->
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>

  <!-- ======================= Bolt: HUD (always visible) ================= -->
  <header class="hud" id="hud">
    <div class="stat stat-gold"><img class="currency-icon" src="/public/assets/img/kucoin.webp" alt="Gold"><span id="stat-gold">0</span></div>
    <div class="stat"><span class="icon">❤️</span><span id="stat-hp">5/5</span></div>
    <div class="stat"><span class="icon">⛩️</span><span id="stat-level">1</span><span id="stat-xp" class="xp-text">0/3</span></div>
    <div class="xp-bar-track"><div class="xp-bar" id="xp-bar"></div></div>
    <span class="spacer"></span>
    <button id="btn-settings" aria-label="Settings">☰</button>
  </header>

  <!-- Bolt: login screen removed — local-only, straight to map. -->

  <!-- ======================= Bolt: map screen ========================== -->
  <main class="screen" id="screen-map" hidden>
    <div class="map-wrap">
      <!-- Bolt: one full map image with soft, invisible interaction regions. -->
      <div class="map-art" id="map-art" role="group" aria-label="Kudosu world map">
        <button class="zone-btn zone-north" data-d="4" aria-label="North: insane puzzles"><span class="zone-label">Insane puzzles</span></button>
        <button class="zone-btn zone-west" data-d="1" aria-label="West: easy puzzles"><span class="zone-label">Easy puzzles</span></button>
        <button class="btn-castle" id="btn-castle" aria-label="Center: Kudosu Castle"><span class="zone-label">Kudosu Castle</span></button>
        <button class="zone-btn zone-east" data-d="3" aria-label="East: hard puzzles"><span class="zone-label">Hard puzzles</span></button>
        <button class="zone-btn zone-south" data-d="2" aria-label="South: normal puzzles"><span class="zone-label">Normal puzzles</span></button>
      </div>
      <button id="map-resume" hidden>Continue <span id="map-resume-zone"></span> puzzle</button>
    </div>
  </main>

  <!-- ======================= Bolt: puzzle screen ======================= -->
  <main class="screen" id="screen-puzzle" hidden>
    <div class="puzzle-wrap">
      <div class="topbar"><h2 id="puzzle-zone">Meadow</h2></div>
      <div class="sudoku-grid" id="sudoku-grid" role="grid" aria-label="Sudoku board"></div>
      <div class="dial" id="dial" aria-label="Digit picker"></div>
      <div class="toolbar">
        <button id="btn-notes" aria-pressed="false">✏️ Notes</button>
        <button id="btn-erase">🧽 Erase</button>
        <button id="btn-undo">↩️ Undo</button>
        <button id="btn-abandon">🗺️ Map</button>
      </div>
    </div>
  </main>

  <!-- ======================= Bolt: castle shop screen ================== -->
  <main class="screen" id="screen-shop" hidden>
    <div class="topbar"><h2 id="puzzle-zone-title">Kudosu Castle</h2><button id="shop-back">✕</button></div>
    <div class="shop-art" id="shop-art" role="img" aria-label="Kudosu Castle shop with a wizard"></div>
    <p id="shop-debt" hidden></p>
    <div class="shop-items">
      <button id="shop-buy-hp">Restore 1 HP — 3 gold</button>
      <button id="shop-buy-maxhp">+1 Max HP — 500 gold</button>
    </div>
  </main>

  <!-- ======================= Bolt: settings screen ===================== -->
  <main class="screen" id="screen-settings" hidden>
    <div class="topbar">
      <h2>Settings</h2>
      <button id="set-back">✕</button>
    </div>
    <!-- Bolt: player row removed — local-only, no nickname. -->
    <div class="setting-row">
      <span>Theme</span>
      <select id="set-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="setting-row">
      <span>Digit animation speed</span>
      <select id="set-speed">
        <option value="slow">Slow</option>
        <option value="normal">Normal</option>
        <option value="fast">Fast</option>
        <option value="instant">Instant</option>
      </select>
    </div>
    <!-- Bolt: Import/Export replace Save progress + Export solved (local-only). -->
    <div class="btn-row">
      <button id="set-export" title="Export stats + solved puzzles to a .txt file">📤 Export</button>
      <button id="set-import" title="Import stats + solved puzzles from a .txt file">📥 Import</button>
    </div>
    <p class="settings-note">
      Export saves your gold, level, XP, and solved puzzles to a .txt file.
      Import it on a new device or after data is cleared.
    </p>
    <p class="settings-note" id="set-offline"></p>
  </main>

  <!-- ======================= Bolt: loading overlay ===================== -->
  <div class="modal" id="screen-loading" hidden>
    <div class="modal-card">
      <h3 id="loading-zone">Meadow</h3>
      <div class="spinner"></div>
      <p id="loading-sub">Consulting the stars…</p>
    </div>
  </div>

  <!-- ======================= Bolt: win modal =========================== -->
  <div class="modal" id="screen-win" hidden>
    <div class="modal-card">
      <h3>Puzzle solved!</h3>
      <p id="win-reward"></p>
      <button id="win-close">🗺️ Back to map</button>
    </div>
  </div>

  <!-- ======================= Bolt: toast =============================== -->
  <div id="toast" hidden></div>

  <!-- ======================= Bolt: scripts ============================= -->
  <script src="/public/vendor/localforage.min.js"></script>
  <script src="/src/utils/sudoku-generator.js"></script>
  <script src="/public/db.js"></script>
  <script src="/public/game.js"></script>
</body>
</html>
